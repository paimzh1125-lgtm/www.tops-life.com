<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <title>苏州永爱 Tops Life | 医用软包装与生物材料专家</title>
    <meta name="description" content="苏州永爱生命科技有限公司 - 专注于医用软包装、精密注塑件及大豆蛋白产品的研发与制造。10年行业经验，致力于医疗和新材料行业创新。" />
    <meta name="keywords" content="苏州永爱, Tops Life, 医用软包装, 医疗注塑, 生物材料, 医疗器械, 苏州医疗科技" />
    <meta name="author" content="Suzhou Tops Life Technology Co.,Ltd." />
    <meta name="theme-color" content="#0F172A" />
    <link rel="icon" type="image/png" href="/images/logo.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="苏州永爱 Tops Life | 医用软包装与生物材料专家" />
    <meta property="og:description" content="专业从事医疗软包装、注塑件与新材料研发。品质卓越，服务全球。" />
    <meta property="og:image" content="/images/logo.png" />
    <meta property="og:url" content="https://www.tops-life.com" />

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              tops: {
                blue: '#40C4FF', // 品牌主色：天空蓝
                dark: '#0F172A', // 深空蓝
                white: '#F8FAFC', // 纯净白
                gray: '#94A3B8', // 辅助灰
              }
            },
            fontFamily: {
              sans: ['"HarmonyOS Sans"', '"MiSans"', '"Microsoft YaHei"', 'sans-serif'],
            },
            backgroundImage: {
              'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
            }
          }
        }
      }
    </script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
      body {
        margin: 0;
        overflow-x: hidden;
        background-color: #F8FAFC;
        font-family: "HarmonyOS Sans", "MiSans", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* 滚动条美化 */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #F8FAFC;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 4px;
        transition: background 0.3s;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #40C4FF;
      }

      /* 初始加载动画样式 (React加载前显示) */
      .initial-loader {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #F8FAFC;
        flex-direction: column;
        color: #0F172A;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #E2E8F0;
        border-top: 3px solid #40C4FF;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
        "@studio-freight/lenis": "https://aistudiocdn.com/@studio-freight/lenis@^1.0.42",
        "gsap": "https://aistudiocdn.com/gsap@^3.13.0",
        "gsap/": "https://aistudiocdn.com/gsap@^3.13.0/",
        "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
        "swiper/": "https://aistudiocdn.com/swiper@^12.0.3/"
      }
    }
    </script>
    
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="spinner"></div>
        <p style="font-size: 14px; font-weight: 500;">Tops Life Loading...</p>
      </div>
    </div>

    <script type="module" src="/index.tsx"></script>
  </body>
</html>
