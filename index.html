<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Default Metadata (Will be overwritten by React Helmet) -->
    <meta name="theme-color" content="#0F172A" />
    <link rel="icon" type="image/png" href="/images/logo.png" />

    <!-- Performance: Preconnect to Font Origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Performance: Load Fonts with display=swap -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Performance: Preload Critical LCP Images (Mobile & Desktop) -->
    <link rel="preload" as="image" href="/banner/hero-mobile.webp" media="(max-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/banner/hero-bg.webp" media="(min-width: 769px)" fetchpriority="high" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <style>
      body {
        margin: 0;
        overflow-x: hidden;
        background-color: #F8FAFC;
        font-family: "HarmonyOS Sans", "MiSans", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* 滚动条美化 */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #F8FAFC;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 4px;
        transition: background 0.3s;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #40C4FF;
      }

      /* 初始加载动画样式 (React加载前显示) */
      .initial-loader {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #F8FAFC;
        flex-direction: column;
        color: #0F172A;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #E2E8F0;
        border-top: 3px solid #40C4FF;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Performance: Force font-display swap for all loaded fonts to prevent FOIT */
      @font-face {
        font-family: 'Inter';
        font-display: swap;
      }
    </style>

  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="spinner"></div>
        <p style="font-size: 14px; font-weight: 500;">Tops Life Loading...</p>
      </div>
    </div>

    <script type="module" src="/index.tsx"></script>
  </body>
</html>
